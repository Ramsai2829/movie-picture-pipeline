name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --system

      - name: Run lint
        working-directory: starter/backend
        run: flake8 .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --system

      - name: Run tests
        working-directory: starter/backend
        run: pytest -v

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image
        id: image
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        working-directory: starter/backend
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push backend image
        run: |
          docker push "${{ steps.image.outputs.image }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Create movies namespace
        run: |
          kubectl create namespace movies \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply backend Kubernetes resources
        run: |
          kubectl apply -k starter/backend/k8s -n movies

      - name: Update backend deployment image
        run: |
          kubectl set image deployment/backend \
            backend=${{ needs.build.outputs.image }} \
            -n movies

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend \
            -n movies \
            --timeout=180s
