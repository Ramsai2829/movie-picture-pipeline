name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run tests
        working-directory: starter/frontend
        run: CI=true npm test -- --watchAll=false

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Get backend LoadBalancer URL
        id: backend
        run: |
          echo "Waiting for backend LoadBalancer..."

          for i in {1..60}; do
            HOSTNAME=$(kubectl get service backend \
              -n movies \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            IP=$(kubectl get service backend \
              -n movies \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            if [ -n "$HOSTNAME" ]; then
              echo "url=http://$HOSTNAME" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -n "$IP" ]; then
              echo "url=http://$IP" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Backend LoadBalancer is not ready yet..."
            sleep 10
          done

          echo "Backend LoadBalancer did not receive an address."
          kubectl get service backend -n movies
          exit 1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set frontend image
        id: image
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ steps.backend.outputs.url }}" \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push frontend image
        run: |
          docker push "${{ steps.image.outputs.image }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Create movies namespace
        run: |
          kubectl create namespace movies \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply frontend Kubernetes resources
        run: |
          kubectl apply -f starter/frontend/k8s/deployment.yaml
          kubectl apply -f starter/frontend/k8s/service.yaml

      - name: Update frontend deployment
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ needs.build.outputs.image }} \
            -n movies

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n movies \
            --timeout=180s
